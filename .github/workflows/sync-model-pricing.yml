name: Sync model pricing

# Refreshes public/model-pricing.json from upstream sources once a day and
# redeploys the site when prices changed. Pushes made with GITHUB_TOKEN do not
# trigger deploy.yml on their own, so this workflow dispatches it explicitly.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-model-pricing
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build price table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:model-pricing
      - name: Commit when prices changed
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- public/model-pricing.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Timestamps and upstream refs change on every run; ship only when the
          # prices or aliases themselves changed (or the file is new).
          if git cat-file -e HEAD:public/model-pricing.json 2>/dev/null; then
            node -e '
              const { execSync } = require("node:child_process");
              const pick = (s) => { const j = JSON.parse(s); return JSON.stringify({ a: j.providerAliases, p: j.prices }); };
              const before = execSync("git show HEAD:public/model-pricing.json").toString();
              const after = require("node:fs").readFileSync("public/model-pricing.json", "utf8");
              process.exit(pick(before) === pick(after) ? 1 : 0);
            ' || { git checkout -- public/model-pricing.json; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          git config user.name "detars-pricing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/model-pricing.json
          git commit -m "chore(pricing): sync model prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
