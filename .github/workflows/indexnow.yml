name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - "src/content/research/**"
      - "src/content/scenarios/**"
      - "src/data/scenarios/**"
      - "src/pages/scenarios/**"
      - "src/pages/**/scenarios/**"
      - "scripts/indexnow.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # scripts/indexnow.mjs imports the "yaml" package, so dependencies must be installed.
      - name: Install dependencies
        run: npm ci
      - name: Submit research and scenario URLs to IndexNow
        run: node scripts/indexnow.mjs
